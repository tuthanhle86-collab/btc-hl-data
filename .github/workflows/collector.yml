name: btc-hl-collector
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
concurrency:
  group: collector
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Prepare data branch
        run: |
          git config user.name "btc-collector"; git config user.email "actions@users.noreply.github.com"
          git fetch origin data --depth=1 || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout -B data origin/data
            git checkout origin/main -- collector.py
          else
            git checkout --orphan data; git rm -rf --cached . >/dev/null 2>&1 || true
            mkdir -p data; echo '{}' > data/status.json; git add data; git commit -qm "data snapshot"
            git checkout origin/main -- collector.py
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install websocket-client
      - name: Collect
        run: python collector.py
      - name: Start next run
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run collector.yml --ref main -R ${{ github.repository }} || true
